name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Engine fold + envelope + sync-serve tests (local-first, wire decode, flaky-serve)
        run: |
          npx tsx test/fold-test.mjs
          npx tsx test/envelope-test.mjs
          npx tsx test/sync-serve-test.mjs

      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (minified, stable signature)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=../whisperbox.keystore \
            -Pandroid.injected.signing.store.password=whisperbox123 \
            -Pandroid.injected.signing.key.alias=whisperbox \
            -Pandroid.injected.signing.key.password=whisperbox123

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find android/app/build/outputs/ -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperbox-android
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Upload to GitHub Release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          TAG="apk-$(date +%Y%m%d-%H%M)"
          cp "$APK_PATH" whisperbox-android.apk
          gh release create "$TAG" \
            --title "WhisperBox Android" \
            --notes "Auto-built from ${GITHUB_SHA}" \
            --prerelease \
            whisperbox-android.apk || echo "Release upload failed (permission) — use artifact instead"
          echo "Artifact: Actions → run → whisperbox-android artifact"
